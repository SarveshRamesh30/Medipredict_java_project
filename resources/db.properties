# MediPredict Database Configuration
# Options for db.type: sqlite | mysql
db.type=sqlite

# SQLite Configuration (Used when db.type=sqlite)
# Automatically creates medipredict.db in the workspace directory
sqlite.url=jdbc:sqlite:medipredict.db

# MySQL Configuration (Used when db.type=mysql)
# Run database/medipredict.sql in your MySQL server before switching
mysql.host=localhost
mysql.port=3306
mysql.database=medipredict
mysql.username=root
mysql.password=root
mysql.url=jdbc:mysql://localhost:3306/medipredict?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
